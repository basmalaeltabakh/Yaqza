version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yaqza-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./yaqza.db
      - ALLOWED_ORIGINS=*
      - PUBLIC_BASE_URL=http://localhost:8000
      - N_READINGS=40
      - MIN_READINGS=30
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - sqlite_data:/app/backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  sqlite_data: